name: portfolio-fadhillah

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    init: true
    env_file: [.env]
    environment:
      APP_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  vite:
    image: node:22-alpine
    init: true
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host=0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    init: true
    env_file: [.env]
    command: php artisan queue:listen --tries=1 --timeout=0
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - composer_vendor:/var/www/html/vendor
    restart: unless-stopped

volumes:
  composer_vendor:
  node_modules:
